<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Satu Tangan - Aplikasi Operator Pendidikan</title>
    <meta name="description" content="Semua kebutuhan pengajar dalam mengolah data siswa dapat diselesaikan secara terpusat dalam satu aplikasi." />
    
    <!-- Android & Mobile Browser Optimization for WebAPK & Home Screen Installation -->
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Satu Tangan" />
    <meta name="application-name" content="Satu Tangan" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Standard PWA Icons (High-Res PNG for Android & iOS) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Open Graph & Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Satu Tangan - Aplikasi Operator Pendidikan" />
    <meta property="og:description" content="Semua kebutuhan pengajar dalam mengolah data siswa dapat diselesaikan secara terpusat dalam satu aplikasi." />
    <meta property="og:image" content="/pwa-512x512.png" />
    
    <!-- Optimized Font Loading for Mobile 3G/4G/5G -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white overscroll-none touch-manipulation">
    <div id="root">
      <!-- Instant Native-Style Loader to prevent white/blank screen on Android -->
      <div id="initial-mobile-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; text-align: center; box-sizing: border-box;">
        <div style="position: relative; width: 72px; height: 72px; margin-bottom: 20px;">
          <img src="/pwa-192x192.png" alt="Satu Tangan" style="width: 100%; height: 100%; border-radius: 18px; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4); object-fit: cover; display: block;" onerror="this.style.display='none'">
        </div>
        <h1 style="font-size: 19px; font-weight: 700; margin: 0 0 6px 0; color: #ffffff; letter-spacing: -0.3px;">Satu Tangan</h1>
        <p style="font-size: 12px; color: #94a3b8; margin: 0 0 20px 0;">Aplikasi Operator Pendidikan</p>
        
        <div style="width: 140px; height: 4px; background: rgba(30, 41, 59, 0.8); border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background: linear-gradient(90deg, #6366f1, #38bdf8); border-radius: 9999px; animation: satutangan-load 1.2s infinite ease-in-out;"></div>
        </div>
        <p style="font-size: 11px; color: #64748b; margin-top: 12px;">Memuat aplikasi...</p>

        <!-- Recovery Card shown if mobile browser takes too long or throws an error -->
        <div id="boot-fallback-card" style="display: none; margin-top: 24px; max-width: 290px; background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; border-radius: 16px; padding: 14px; text-align: center;">
          <p style="font-size: 12px; color: #f87171; margin: 0 0 6px 0; font-weight: 600;">Memuat Terasa Lama?</p>
          <p style="font-size: 11px; color: #94a3b8; margin: 0 0 10px 0; line-height: 1.4;">Ketuk tombol untuk membersihkan cache service worker & memuat ulang secara bersih.</p>
          <button onclick="cleanAndReloadApp()" style="width: 100%; padding: 8px 12px; background: #4f46e5; color: #ffffff; border: none; border-radius: 10px; font-size: 11px; font-weight: 600; cursor: pointer;">
            Bersihkan Cache & Segarkan
          </button>
        </div>
      </div>
      <style>
        @keyframes satutangan-load {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(300%); }
        }
      </style>
    </div>

    <script>
      function cleanAndReloadApp() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
            });
          }
          try { localStorage.clear(); } catch(e){}
        } catch (e) {
          console.warn(e);
        }
        window.location.reload();
      }

      // Show recovery button after 5 seconds if app hasn't mounted
      setTimeout(function() {
        var card = document.getElementById('boot-fallback-card');
        var loader = document.getElementById('initial-mobile-loader');
        if (card && loader) {
          card.style.display = 'block';
        }
      }, 5000);

      window.addEventListener('error', function(e) {
        var card = document.getElementById('boot-fallback-card');
        if (card) {
          card.style.display = 'block';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
